<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>С Днём Рождения, Папа!</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background-color: #1a1a2e;
    }
    
    /* Фоновое изображение */
    .bg-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('bg.jpg');
      background-size: cover;
      background-position: center;
      filter: brightness(0.65);
      z-index: 1;
    }

    /* Верхняя панель счета */
    .score-board {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.75);
      padding: 12px 24px;
      border-radius: 25px;
      color: #ffffff;
      font-size: 20px;
      font-weight: bold;
      z-index: 10;
      border: 2px solid #ffcc00;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      text-align: center;
    }

    /* Летающий персонаж */
    .character {
      position: absolute;
      width: 130px;
      height: 130px;
      border-radius: 50%;
      border: 4px solid #ffcc00;
      box-shadow: 0 0 20px rgba(255, 204, 0, 0.9);
      background-image: url('avatar.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      cursor: pointer;
      z-index: 5;
      transition: transform 0.1s ease;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    
    .character::after {
      content: '🎂';
      position: absolute;
      bottom: -5px;
      right: -5px;
      font-size: 32px;
    }

    .character:active {
      transform: scale(0.9);
    }

    /* Подарочная коробка */
    .gift-box {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 100px;
      cursor: pointer;
      z-index: 10;
      animation: pulse 1.2s infinite alternate;
    }

    @keyframes pulse {
      0% { transform: translate(-50%, -50%) scale(1); }
      100% { transform: translate(-50%, -50%) scale(1.15); }
    }

    /* Модальное окно для видео */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.92);
      z-index: 100;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    video {
      max-width: 90%;
      max-height: 80%;
      border-radius: 12px;
    }

    .close-btn {
      margin-top: 15px;
      padding: 10px 25px;
      background: #ff4757;
      color: white;
      border: none;
      border-radius: 20px;
      font-size: 16px;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="bg-container"></div>

  <div class="score-board">
    Счёт: <span id="score">0</span> / 45
  </div>

  <div class="character" id="char"></div>

  <div class="gift-box" id="gift">🎁</div>

  <div class="modal" id="videoModal">
    <video id="myVideo" controls playsinline>
      <source src="video.mp4" type="video/mp4">
      Ваш браузер не поддерживает видео.
    </video>
    <button class="close-btn" onclick="closeModal()">Закрыть</button>
  </div>

  <script>
    let score = 0;
    const targetScore = 45;
    const char = document.getElementById('char');
    const scoreEl = document.getElementById('score');
    const gift = document.getElementById('gift');
    const modal = document.getElementById('videoModal');
    const video = document.getElementById('myVideo');

    function moveCharacter() {
      const padding = 140;
      const maxX = window.innerWidth - padding;
      const maxY = window.innerHeight - padding;
      
      const randomX = Math.max(20, Math.floor(Math.random() * maxX));
      const randomY = Math.max(100, Math.floor(Math.random() * maxY));

      char.style.left = randomX + 'px';
      char.style.top = randomY + 'px';
    }

    char.addEventListener('click', () => {
      score += 5;
      scoreEl.textContent = score;

      if (score >= targetScore) {
        char.style.display = 'none';
        gift.style.display = 'block';
      } else {
        moveCharacter();
      }
    });

    gift.addEventListener('click', () => {
      modal.style.display = 'flex';
      video.play();
    });

    function closeModal() {
      modal.style.display = 'none';
      video.pause();
    }

    moveCharacter();
  </script>
</body>
</html>
